services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aerobooking
      POSTGRES_USER: aero
      POSTGRES_PASSWORD: aero-demo-only
    volumes:
      - aerobooking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aero -d aerobooking"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://aero:aero-demo-only@db:5432/aerobooking
    depends_on:
      db:
        condition: service_healthy

volumes:
  aerobooking_pgdata:
